services:
  - type: web
    name: audit-agent-ai-service
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AuditIQ
      - key: STT_PROVIDER
        value: deepgram
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MAX_INPUT_TOKENS
        value: "110000"
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
